
# GhostWalk: local development
# Default: MinIO + HydraDB + GhostWalk API/dashboard
# Optional: docker compose --profile eval up -d --build

name: ghostwalk

services:
  # --------------------------------------------------
  # MinIO: S3-compatible persistent object storage
  # --------------------------------------------------
  minio:
    build:
      context: ./deploy/minio
    image: ghostwalk-minio:2025-09-07
    restart: unless-stopped
    command:
      - server
      - /data
      - --address
      - ":9000"
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: "off"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9000/minio/health/ready
      interval: 3s
      timeout: 3s
      retries: 40

  # --------------------------------------------------
  # Create bucket and restricted HydraDB user
  # --------------------------------------------------
  minio-init:
    image: ghostwalk-minio:2025-09-07
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - /init.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      HYDRA_S3_KEY: ${HYDRA_S3_KEY:?Set HYDRA_S3_KEY in .env}
      HYDRA_S3_SECRET: ${HYDRA_S3_SECRET:?Set HYDRA_S3_SECRET in .env}
      BUCKET: ${HYDRA_BUCKET:-ghostwalk}
    volumes:
      - ./deploy/minio/init.sh:/init.sh:ro

  # --------------------------------------------------
  # HydraDB 0.4.0: MinIO-backed graph storage
  # --------------------------------------------------
  hydradb:
    image: ghcr.io/hydra-db/hydradb@sha256:ab71d651fefee13ebb23eb56d72316065bdca563ff7587442e07be663f2bf880
    restart: "no"

    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /var/cache/slatedb/store /var/cache/slatedb/cache &&
        echo "$$HYDRA_TOKEN" > /tmp/graph/auth-token &&
        if [ "$$CLOUD_PROVIDER" = local ]; then
          unset AWS_ENDPOINT AWS_BUCKET_NAME AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ALLOW_HTTP AWS_DEFAULT_REGION;
        fi &&
        exec graph-node

    depends_on:
      minio-init:
        condition: service_completed_successfully

    environment:
      CLOUD_PROVIDER: ${HYDRA_CLOUD_PROVIDER:-aws}
      LOCAL_PATH: /var/cache/slatedb/store

      AWS_BUCKET_NAME: ${HYDRA_BUCKET:-ghostwalk}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: ${HYDRA_S3_KEY}
      AWS_SECRET_ACCESS_KEY: ${HYDRA_S3_SECRET}

      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0

      GRAPH_BOLT_NODE_ADDRESSES: node-0=hydradb:7687
      GRAPH_ADVERTISED_BOLT_ADDR: hydradb:7687

      GRAPH_DATA_CACHE_DIR: /var/cache/slatedb/cache
      GRAPH_AUTH_TOKEN_FILE: /tmp/graph/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
      GRAPH_USAGE_REPORT_ENABLED: "false"

      HYDRA_TOKEN: ${HYDRA_TOKEN:?Set HYDRA_TOKEN in .env}

    ports:
      - "8443:8443"
      - "9090:9090"
      - "7687:7687"

    volumes:
      - hydradb-data:/var/cache/slatedb

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9090
      interval: 3s
      timeout: 3s
      retries: 60

  # --------------------------------------------------
  # GhostWalk API + dashboard
  # --------------------------------------------------
  app:
    build: .
    restart: unless-stopped

    depends_on:
      hydradb:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      AUTH_MODE: ${AUTH_MODE:-none}
      GW_PUBLIC_URL: ${GW_PUBLIC_URL:-http://localhost:8000}

      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}

      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-ghostwalk}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_PR_TOKEN: ${GITHUB_PR_TOKEN:-}

      GW_STORE: hydradb
      HYDRA_URL: http://hydradb:8443
      HYDRA_READY: http://hydradb:9090/readyz
      HYDRA_TOKEN: ${HYDRA_TOKEN:?Set HYDRA_TOKEN in .env}

      GW_DEMO_INCIDENTS: ${GW_DEMO_INCIDENTS:-30}

    volumes:
      - gw-data:/data

  # --------------------------------------------------
  # Evaluation-only services
  # --------------------------------------------------
  redis:
    image: redis:7-alpine
    profiles:
      - eval
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    profiles:
      - eval
    environment:
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: gw
      POSTGRES_DB: gw
    ports:
      - "5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gw -d gw
      interval: 2s
      timeout: 2s
      retries: 30

  eval:
    profiles:
      - eval
    build:
      context: .
      dockerfile: Dockerfile.eval
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hydradb:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      PG_URL: postgresql://gw:gw@postgres:5432/gw
      HYDRA_URL: http://hydradb:8443
      HYDRA_READY: http://hydradb:9090/readyz
    volumes:
      - .:/app
    command:
      - python
      - eval/store_swap.py
      - --split
      - test

volumes:
  minio-data:
  hydradb-data:
  gw-data:
