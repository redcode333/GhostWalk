name: GhostWalk dependency diff
description: Comment the blast radius of the dependencies a pull request adds or removes. Read-only; works offline against a graph export.
inputs:
  graph:
    description: Path to a graph export (`gw export > graph.json`). Optional; without it the comment lists edges but no blast radius.
    default: graph.json
  base:
    description: Base ref to compare from.
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: Head ref to compare to.
    default: ${{ github.event.pull_request.head.sha }}
  comment:
    description: Post the PR comment ("false" only writes the markdown to the job summary).
    default: "true"
  github-token:
    description: Token used to post the comment (needs pull-requests write). Not needed for the diff itself.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install pipx
      shell: bash
      run: python -m pip install --quiet pipx
    - name: gw diff
      shell: bash
      env:
        GW_BASE: ${{ inputs.base }}
        GW_HEAD: ${{ inputs.head }}
        GW_GRAPH: ${{ inputs.graph }}
      run: |
        # the checkout must have both commits: use actions/checkout with fetch-depth: 0
        args=(--base "$GW_BASE" --head "$GW_HEAD" --format markdown)
        if [ -f "$GW_GRAPH" ]; then args+=(--graph "$GW_GRAPH"); fi
        pipx run --spec ghostwalk gw diff "${args[@]}" > "$RUNNER_TEMP/ghostwalk-diff.md"
        cat "$RUNNER_TEMP/ghostwalk-diff.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Post or update the comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        GW_COMMENT_FILE: ${{ runner.temp }}/ghostwalk-diff.md
        GW_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs")
          const upsert = require(`${process.env.GW_ACTION_PATH}/upsert.js`)
          const r = await upsert({ github, context, body: fs.readFileSync(process.env.GW_COMMENT_FILE, "utf8") })
          core.info(`ghostwalk comment ${r.action} (${r.id})`)
