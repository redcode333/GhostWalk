name: hydradb-image
# Builds the HydraDB graph-node (release mode) and publishes it as the prebuilt image the GhostWalk compose file uses by default.
on:
  workflow_dispatch:
    inputs:
      hydradb_ref:
        description: hydra-db/hydradb ref to build (tag, branch or sha)
        default: v0.4.0
  push:
    branches: [main]
    paths: [docker/hydradb.Dockerfile, .github/workflows/hydradb-image.yml]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/redcode333/ghostwalk-hydradb

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check out HydraDB
        uses: actions/checkout@v4
        with:
          repository: hydra-db/hydradb
          ref: ${{ inputs.hydradb_ref || 'v0.4.0' }}
          path: hydradb
      - name: Free disk (a release build of HydraDB is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: hydradb
          file: docker/hydradb.Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name hdb -p 8443:8443 -p 9090:9090 \
            -e CLOUD_PROVIDER=local -e LOCAL_PATH=/data/store -e GRAPH_NAMESPACE=default -e GRAPH_ID=default -e GRAPH_CELL_ID=cell-0 -e GRAPH_CELLS=cell-0 \
            -e GRAPH_NODE_ID=node-0 -e GRAPH_BOLT_NODE_ADDRESSES=node-0=127.0.0.1:7687 -e GRAPH_ADVERTISED_BOLT_ADDR=127.0.0.1:7687 \
            -e GRAPH_DATA_CACHE_DIR=/data/cache -e GRAPH_ALLOW_PLAINTEXT=true -e RUST_MIN_STACK=33554432 -e GRAPH_USAGE_REPORT_ENABLED=false \
            -e GRAPH_AUTH_TOKEN_FILE=/tmp/graph/auth-token --entrypoint /bin/sh ${{ env.IMAGE }}:${{ github.sha }} \
            -c "printf '%s\n' local-development-token-32-bytes > /tmp/graph/auth-token && exec graph-node"
          for i in $(seq 1 60); do curl -fsS localhost:9090/readyz && break; sleep 2; done
          curl -fsS -X POST localhost:8443/v1/graphs/default/query -H 'Authorization: Bearer local-development-token-32-bytes' \
            -H 'X-Graph-Namespace: default' -H 'content-type: application/json' -d '{"cell_id":"cell-0","query":"RETURN 1 AS x","parameters":{}}'
