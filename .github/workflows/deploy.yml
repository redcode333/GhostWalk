name: deploy
# Backend: on a push to main that touches the API, SSH to the VM, pull, rebuild, smoke test.
# Frontend: Vercel builds web/ from the same push (Git integration) with VITE_API_URL set in the Vercel project.
# Needs repository secrets: VM_HOST, VM_USER, VM_SSH_KEY (a dedicated deploy key, not a personal one). Without them the deploy step is skipped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ghostwalk/**", "gwsim/**", "baselines/**", "eval/**", "results.json", "Dockerfile", "deploy/**", "pyproject.toml"]
concurrency: {group: deploy, cancel-in-progress: false}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e . pytest
      # the HydraDB tests (parity, memory, async learning) need a node and run locally; everything else runs here
      - run: pytest -q -k "not parity and not test_memory and not test_async_learning"
  deploy:
    needs: test
    # only on main (never on forks or pull requests); skipped, not failed, when the secrets are absent
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      API_URL: https://api.13-51-194-36.sslip.io
    steps:
      - name: check the deploy secrets
        id: secrets
        run: |
          if [ -n "$VM_HOST" ] && [ -n "$VM_USER" ] && [ -n "$VM_SSH_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::VM_HOST, VM_USER or VM_SSH_KEY is not set: the deploy step is skipped"; fi
      - name: update the VM
        if: steps.secrets.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" 'cd GhostWalk && ./deploy/setup.sh update'
      - name: smoke test the live API
        if: steps.secrets.outputs.present == 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$API_URL/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "health check failed" >&2; exit 1
